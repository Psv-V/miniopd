[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "miniopd"
dynamic = ["version"]
description = "Low-cost on-policy distillation for small-model mathematical reasoning"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "huggingface-hub>=0.27",
    "PyYAML>=6",
]

[project.optional-dependencies]
data = [
    "datasets==4.8.5",
]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]
sft = [
    "accelerate>=1.2,<2",
    "datasets==4.8.5",
    "transformers>=4.48,<5",
]
opd-tests = [
    "torch>=2.2",
]

[project.scripts]
miniopd = "miniopd.cli:main"

[tool.setuptools.dynamic]
version = { attr = "miniopd.__version__" }

[tool.setuptools.packages.find]
include = ["miniopd*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 88
src = ["miniopd", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]
